name: Victim Deploy Workflow

# This simulates a production deployment workflow
# that could be cancelled by a fork PR

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        type: choice
        options:
          - long-running-deploy
          - quick-test

  # CRITICAL: pull_request_target runs in BASE repo context
  # This means fork PRs run with base repo's concurrency groups
  pull_request_target:
    types: [opened, synchronize]

# Concurrency group based on target branch
# If fork PR targets 'main', it joins group 'deploy-main'
concurrency:
  group: deploy-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Info
        run: |
          echo "============================================"
          echo "DEPLOYMENT WORKFLOW"
          echo "============================================"
          echo ""
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Ref Name: $GITHUB_REF_NAME"
          echo "Base Ref: $GITHUB_BASE_REF"
          echo "Head Ref: $GITHUB_HEAD_REF"
          echo ""
          echo "Concurrency Group: deploy-${{ github.base_ref || github.ref_name }}"
          echo ""
          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            echo "!!! This is a PR - check if it's from a fork !!!"
            echo "PR Head Repo: ${{ github.event.pull_request.head.repo.full_name }}"
            echo "PR Base Repo: ${{ github.event.pull_request.base.repo.full_name }}"
            echo "Is Fork: ${{ github.event.pull_request.head.repo.fork }}"
          fi

      - name: Long Running Deployment
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'long-running-deploy'
        run: |
          echo ""
          echo "Starting long deployment (120 seconds)..."
          echo "If a fork PR cancels this, that's a vulnerability!"
          echo ""
          for i in {1..120}; do
            echo "Deploying... $i/120"
            sleep 1
          done
          echo ""
          echo "Deployment completed successfully!"
          echo "Was NOT cancelled by fork PR."

      - name: PR Triggered Run
        if: github.event_name == 'pull_request_target'
        run: |
          echo ""
          echo "This workflow was triggered by a PR"
          echo ""
          echo "If this PR is from a FORK and it cancelled"
          echo "a running deployment on main, that's a bug!"
          echo ""
          echo "Completing quickly..."
